limit_req_zone $binary_remote_addr zone=beta_client:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=beta_signup:1m rate=6r/m;
limit_req_zone $server_name zone=beta_total:1m rate=70r/s;
limit_req_zone $server_name zone=beta_signup_total:1m rate=30r/m;

server {
    listen 127.0.0.1:8080;
    server_name _;
    server_tokens off;
    access_log off;
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $social_backend social:8790;

    client_max_body_size 12k;
    limit_req_status 429;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;

    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    absolute_redirect off;
    location = / { return 302 /beta; }
    location = /beta/ { return 302 /beta; }
    location = /beta {
        alias /usr/share/nginx/html/beta/index.html;
        default_type text/html;
    }
    location = /beta/app.js { root /usr/share/nginx/html; }
    location = /beta/styles.css { root /usr/share/nginx/html; }
    location = /health { proxy_pass http://$social_backend; }

    location ~ ^/api/social(?:-en)?/(session|google(?:/challenge)?)$ {
        limit_req zone=beta_signup burst=6 nodelay;
        limit_req zone=beta_signup_total burst=20 nodelay;
        proxy_pass http://$social_backend;
    }
    location ~ ^/api/social(?:-en)?/ {
        limit_req zone=beta_client burst=20 nodelay;
        limit_req zone=beta_total burst=100 nodelay;
        proxy_pass http://$social_backend;
    }
    location / { return 404; }
}
