map $http_host $lettrine_local_host {
    default 0;
    "~^(127[.]0[.]0[.]1|localhost)(:[0-9]{1,5})?$" 1;
}
limit_req_zone $binary_remote_addr zone=lettrine_requests:1m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=lettrine_connections:1m;

server {
    listen 8080;
    server_name localhost 127.0.0.1;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 32m;
    client_body_timeout 20s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    if ($lettrine_local_host = 0) { return 421; }

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/x-ndjson text/csv;

    location = / {
        rewrite ^ /salons.html last;
    }
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
    location = /salons-network.json {
        default_type application/json;
        expires -1;
        return 200 '{"origin":"$lettrine_rooms_origin"}';
    }
    location ~ ^/(api/|download/|health$) {
        include /etc/nginx/lettrine/proxy.conf;
    }
    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }
}
