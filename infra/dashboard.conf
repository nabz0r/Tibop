map $http_host $lettrine_local_host {
    default 0;
    "~^(127[.]0[.]0[.]1|localhost)(:[0-9]{1,5})?$" 1;
}
limit_req_zone $binary_remote_addr zone=lettrine_requests:1m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=lettrine_connections:1m;

server {
    listen 8080;
    server_name localhost 127.0.0.1;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 32m;
    client_body_timeout 20s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    if ($lettrine_local_host = 0) { return 421; }

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/x-ndjson text/csv;

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
    location ~ ^/(api/|download/|health$) {
        if ($http_sec_fetch_site = cross-site) { return 403; }
        set $expected_origin "$scheme://$http_host";
        set $rejected 0;
        if ($http_origin != "") { set $rejected 1; }
        if ($http_origin = $expected_origin) { set $rejected 0; }
        if ($rejected = 1) { return 403; }

        limit_req zone=lettrine_requests burst=45 nodelay;
        limit_req_status 429;
        limit_conn lettrine_connections 20;
        limit_conn_status 429;
        set $backend http://api:8787;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 105s;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }
    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }
}
