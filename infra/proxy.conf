if ($http_sec_fetch_site = cross-site) { return 403; }
set $expected_origin "$scheme://$http_host";
set $rejected 0;
if ($http_origin != "") { set $rejected 1; }
if ($http_origin = $expected_origin) { set $rejected 0; }
if ($rejected = 1) { return 403; }

limit_req zone=lettrine_requests burst=45 nodelay;
limit_req_status 429;
limit_conn lettrine_connections 20;
limit_conn_status 429;
set $backend http://api:8787;
proxy_pass $backend$request_uri;
proxy_http_version 1.1;
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 105s;
proxy_set_header Host $http_host;
proxy_set_header Connection "";
