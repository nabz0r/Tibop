[package]
name = "lettrine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
rand = "0.10"
rand_xoshiro = "0.8"
redis = { version = "1.2", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
unicode-normalization = "0.1"
wolges = { git = "https://github.com/andy-k/wolges.git", rev = "839acd051a2606e53478008d49ed2215f894952b" }
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 4
