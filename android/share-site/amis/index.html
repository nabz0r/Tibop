<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#252e61">
  <meta name="referrer" content="no-referrer">
  <title>Invitation à jouer · WordRivet</title>
  <style>
    :root { color-scheme: light; font: 16px/1.55 system-ui, sans-serif; color: #252e61; background: #f1efe4; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    main { max-width: 35rem; padding: clamp(1rem, 6vw, 2.5rem); margin: 4vh auto; }
    .brand { font-weight: 700; margin: 0 0 1rem; }
    article { overflow: hidden; border-radius: 1.5rem; background: #fffaf0; border: 1px solid #daddd0; box-shadow: 0 .75rem 2.5rem #1a332917; }
    header { padding: 1.65rem; background: linear-gradient(135deg, #394b9f, #1c2440); color: #fffaf0; }
    h1 { margin: 0; font: clamp(2rem, 7vw, 3.25rem)/1.04 Georgia, serif; }
    section { padding: 1.65rem; }
    p { margin: 0 0 1.1rem; }
    .action { display: flex; justify-content: center; align-items: center; min-height: 3rem; border: 1px solid #b5c2af; border-radius: .8rem; padding: .65rem .9rem; color: #252e61; text-decoration: none; font-weight: 650; text-align: center; }
    .primary { background: #252e61; border-color: #252e61; color: #fffaf0; margin-bottom: 1rem; }
    .action:focus-visible { outline: 3px solid #73875d; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">WordRivet</p>
    <article>
      <header><h1 id="h1">Invitation à jouer</h1></header>
      <section>
        <div id="invitation" hidden>
          <p id="intro">Ajoute ton ami dans WordRivet, puis joue un duel à ton rythme.</p>
          <a class="action primary" id="open">Ouvrir dans WordRivet</a>
        </div>
        <p id="invalid">Ouvre le lien complet envoyé par ton ami pour retrouver l’invitation.</p>
        <a id="download" class="action" href="https://raw.githubusercontent.com/nabz0r/scrabnble/refs/tags/v0.16.1/android/artifacts/lettrine.apk">Télécharger l’APK Android <span>0.16.1</span></a>
      </section>
    </article>
  </main>
  <script>
    const token = location.hash.slice(1);
    const english = token.startsWith('en/');
    if (english) {
      document.documentElement.lang = 'en';
      document.title = "Invitation to play \u00b7 WordRivet";
      const labels = {"h1": "Invitation to play", "intro": "Add your friend in WordRivet, then play a duel at your own pace.", "open": "Open in WordRivet", "invalid": "Open the complete link from your friend to find the invitation."};
      for (const [id, text] of Object.entries(labels)) document.getElementById(id).textContent = text;
      const download = document.getElementById("download");
      download.textContent = "Download Android APK " + download.querySelector("span").textContent;
    }
    if (/^(?:en\/)?[0-9a-f]{32}$/.test(token)) {
      document.getElementById('open').href = 'lettrine://amis/v1/' + token;
      document.getElementById('invitation').hidden = false;
      document.getElementById('invalid').hidden = true;
    }
  </script>
</body>
</html>
