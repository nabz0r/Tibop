<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ff">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Retrouve tes amis dans Tibop pour un duel de lettres.">
  <title>Invitation à jouer · Tibop</title>
  <link rel="icon" href="../tibop-icon.png" type="image/png">
  <link rel="stylesheet" href="../tibop.css">
</head>
<body>
  <main>
    <p class="brand"><img src="../tibop-icon.png" width="40" height="40" alt=""> Tibop</p>
    <article>
      <header class="hero"><h1 id="h1">Invitation à jouer</h1></header>
      <section class="body invitation">
        <div id="invitation" hidden>
          <p id="intro">Ajoute ton ami dans Tibop, puis joue un duel à ton rythme.</p>
          <a class="button primary" id="open">Ouvrir dans Tibop</a>
        </div>
        <p id="invalid">Ouvre le lien complet envoyé par ton ami pour retrouver l’invitation.</p>
        <a id="download" class="button" href="https://github.com/nabz0r/Tibop/releases/download/v0.16.7/Tibop-0.16.7.apk"><span id="download-label">Télécharger l’APK</span> 0.16.7</a>
      </section>
    </article>
  </main>
  <script>
    const token = location.hash.slice(1);
    const english = token.startsWith('en/');
    if (english) {
      document.documentElement.lang = 'en';
      document.title = "Invitation to play \u00b7 Tibop";
      const labels = {"h1": "Invitation to play", "intro": "Add your friend in Tibop, then play a duel at your own pace.", "open": "Open in Tibop", "invalid": "Open the complete link from your friend to find the invitation."};
      for (const [id, text] of Object.entries(labels)) document.getElementById(id).textContent = text;
      document.getElementById("download-label").textContent = "Download the APK";
    }
    if (/^(?:en\/)?[0-9a-f]{32}$/.test(token)) {
      document.getElementById('open').href = 'lettrine://amis/v1/' + token;
      document.getElementById('invitation').hidden = false;
      document.getElementById('invalid').hidden = true;
    }
  </script>
</body>
</html>
