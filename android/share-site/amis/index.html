<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18352a">
  <meta name="referrer" content="no-referrer">
  <title>Invitation à jouer · Lettrine</title>
  <style>
    :root { color-scheme: light; font: 16px/1.55 system-ui, sans-serif; color: #18352a; background: #f1efe4; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    main { max-width: 35rem; padding: clamp(1rem, 6vw, 2.5rem); margin: 4vh auto; }
    .brand { font-weight: 700; margin: 0 0 1rem; }
    article { overflow: hidden; border-radius: 1.5rem; background: #fffaf0; border: 1px solid #daddd0; box-shadow: 0 .75rem 2.5rem #1a332917; }
    header { padding: 1.65rem; background: linear-gradient(135deg, #284e3e, #17342a); color: #fffaf0; }
    h1 { margin: 0; font: clamp(2rem, 7vw, 3.25rem)/1.04 Georgia, serif; }
    section { padding: 1.65rem; }
    p { margin: 0 0 1.1rem; }
    .action { display: flex; justify-content: center; align-items: center; min-height: 3rem; border: 1px solid #b5c2af; border-radius: .8rem; padding: .65rem .9rem; color: #18352a; text-decoration: none; font-weight: 650; text-align: center; }
    .primary { background: #18352a; border-color: #18352a; color: #fffaf0; margin-bottom: 1rem; }
    .action:focus-visible { outline: 3px solid #73875d; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Lettrine</p>
    <article>
      <header><h1>Invitation à jouer</h1></header>
      <section>
        <div id="invitation" hidden>
          <p>Ajoute ton ami dans Lettrine, puis joue un duel à ton rythme.</p>
          <a class="action primary" id="open">Ouvrir dans Lettrine</a>
        </div>
        <p id="invalid">Ouvre le lien complet envoyé par ton ami pour retrouver l’invitation.</p>
        <a class="action" href="https://raw.githubusercontent.com/nabz0r/scrabnble/main/android/artifacts/lettrine.apk">Télécharger l’APK Android</a>
      </section>
    </article>
  </main>
  <script>
    const token = location.hash.slice(1);
    if (/^[0-9a-f]{32}$/.test(token)) {
      document.getElementById('open').href = 'lettrine://amis/v1/' + token;
      document.getElementById('invitation').hidden = false;
      document.getElementById('invalid').hidden = true;
    }
  </script>
</body>
</html>
